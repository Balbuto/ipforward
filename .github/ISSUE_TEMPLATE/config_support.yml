name: Configuration / поддержка
description: Вопрос по настройке (не баг и не запрос фичи)
title: "[support]: "
labels: ["question", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Перед созданием тикета проверьте раздел «Устранение неполадок» в README
        и вывод `sudo ipforward diag`.

  - type: textarea
    id: goal
    attributes:
      label: Что вы хотите получить
      description: Опишите топологию — откуда, куда и по какому протоколу нужен проброс.
      placeholder: |
        VPS с публичным IP, Xray на внутреннем хосте 10.0.0.5:443.
        Хочу, чтобы клиенты подключались к 443 на VPS.
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: Текущая конфигурация
      description: Какие правила уже есть и что вы пробовали.
      value: |
        ```
        $ sudo ipforward list
        $ sudo ipforward diag
        $ sudo sysctl net.ipv4.ip_forward
        $ sudo iptables -t nat -L PREROUTING -n -v
        ```
      render: shell
    validations:
      required: true

  - type: textarea
    id: errors
    attributes:
      label: Сообщения об ошибках
      description: Вставьте дословно, без пересказа.
      render: shell

  - type: input
    id: distro
    attributes:
      label: Дистрибутив
      placeholder: "Ubuntu 24.04"
    validations:
      required: true
